    - unified/actor_link_target_rot6d
    - unified/actor_link_time_offsets
    d_model: 512
    n_heads: 8
    n_kv_heads: 4
    use_gated_attn: true
    n_layers: 1
    dense_layer_at_first: false
    ff_mult: 0.5
    ff_mult_dense: 4
    attn_dropout: 0.0
    mlp_dropout: 0.0
    max_ctx_len: 32
    rope_max_seq_len: 8192
    aux_sys_id_weight: 0.0
    aux_dynamics_weight: 0.0
    obs_norm:
      enabled: true
      epsilon: 1.0e-08
      update_method: ema
      ema_momentum: 0.0001
      update_at_train: true
      update_at_eval: false
      enable_clipping: true
      clip_range: 10.0
      sync_interval_steps: 4
    obs_schema:
